name: CI/CD Pipeline

on: [ push, pull_request, workflow_dispatch ]

env:
  PIP_CACHE_DIR: /tmp/pipcache
  HOME_REPO: datakortet/dkredis

jobs:
  ci-lint:
    name: CI:Lint
    runs-on: ubuntu-latest
    env:
      LINTDIR: ./ghlint
    steps:
      # setup environment
      - uses: actions/checkout@v4
      - name: setup directories
        shell: bash
        run: |
          mkdir -p $PIP_CACHE_DIR
          mkdir -p $LINTDIR
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install flake8
      - run: flake8 dkredis/** --max-line-length=199

  docs:
    name: CI:Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: setup directories
        shell: bash
        run: |
          mkdir -p build
      - run: pip install sphinx
      - run: pip install -e .
      - run: sphinx-build -W -b html docs build/sphinx/html
      - run: sphinx-build -W -n -T -b man docs build/sphinx/man

      - name: Upload docs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Docs
          path: build/sphinx/

  ci-test:
    name: CI:Test (py${{ matrix.python-version }}, redis ${{ matrix.redis-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:

        # current matrix
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

        # redis server versions we must stay compatible with:
        #   4 - WSL dev box (4.0.9)
        #   5 - fischer (5.0.7)
        #   6 - ubuntu 22.04 (6.0.x), first version with HELLO/RESP3
        #   7 - ubuntu 24.04 (7.0.x)
        #   8 - latest
        # requirements.txt pins redis-py 5.0.1 (py<3.12) and 8.1.0
        # (py>=3.12), so the full product also covers both client
        # versions against every server version.
        redis-version: [4, 5, 6, 7, 8]

        os: [ubuntu-latest]

        # cannot use supercharge/redis on windows
        # include:
        #   - python-version: '3.11'
        #     os: windows-latest
        #   - python-version: '3.9'
        #     os: macos-latest
        #   - python-version: '3.10.0-rc.2'
        #     os: ubuntu-latest
        #     experimental: true


    steps:
      # setup environment
      - uses: actions/checkout@v4
      - name: setup global directories
        shell: bash
        run: mkdir -p $PIP_CACHE_DIR
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: supercharge/redis-github-action@1.8.0
        with:
          redis-version: ${{ matrix.redis-version }}

      - run: pip install -r requirements.txt
      - run: pip list
      - run: pytest -vv --cov=dkredis tests

      - name: Upload coverage to codecov.io
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN}}
          fail_ci_if_error: false

  cd:
    name: CD
    needs: ci-test
    runs-on: ubuntu-latest
    steps:
      # setup environment
      - uses: actions/checkout@v4
      - name: setup directories
        shell: bash
        run: mkdir -p $PIP_CACHE_DIR
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cleanup
        run: |
          rm -rf dist
          rm -rf build

      - run: pip install -U build twine
      - run: python -m build

      - name: Upload packages as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Packages
          path: dist/

      - name: Deploy to PyPI
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == env.HOME_REPO
        shell: bash
        run: |
          twine upload -u __token__ -p ${{ secrets.PYPI_API_TOKEN }} dist/*      

      - name: Create Github release
        uses: ncipollo/release-action@v1
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == env.HOME_REPO
        with:
          artifacts: "dist/*"
          owner: datakortet
          repo: dkredis
          token: ${{ secrets.GITHUB_TOKEN }}
